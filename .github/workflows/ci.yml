name: CI

on:
  pull_request:
    branches: ["*"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
# @link https://turborepo.org/docs/core-concepts/remote-caching#remote-caching-on-vercel-builds
env:
  FORCE_COLOR: 3
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup

      - name: Copy env
        shell: bash
        run: cp .env.example .env

      - name: Lint
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup
        uses: ./tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck

  sushiro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sushiro_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sushiro_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SUSHIRO_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sushiro_ci
      SUSHIRO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sushiro_ci
    steps:
      - uses: actions/checkout@v6
      - uses: ./tooling/github/setup
      - name: Apply migrations and verify reruns
        run: |
          pnpm --filter @eslee/sushiro db:migrate
          pnpm --filter @eslee/sushiro db:migrate
      - name: Test Sushiro and database lifecycle
        run: pnpm --filter @eslee/sushiro test

  what-beats-jev-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: what_beats_jev_ci
          PGDATA: /var/lib/postgresql/data/pgdata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d what_beats_jev_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WHAT_BEATS_JEV_DATABASE_URL: postgres://postgres:postgres@localhost:5432/what_beats_jev_ci?sslmode=require
      WHAT_BEATS_JEV_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/what_beats_jev_ci?sslmode=require
    steps:
      - uses: actions/checkout@v6
      - uses: ./tooling/github/setup
      - name: Apply game migrations and verify reruns
        run: |
          pnpm --filter @eslee/what-beats-jev db:migrate
          pnpm --filter @eslee/what-beats-jev db:migrate
      - name: Test game rules and transactional matchup reuse
        run: pnpm --filter @eslee/what-beats-jev test

  jev-mbti-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: ghcr.io/railwayapp-templates/postgres-ssl:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jev_mbti_ci
          PGDATA: /var/lib/postgresql/data/pgdata
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jev_mbti_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JEV_MBTI_DATABASE_URL: postgres://postgres:postgres@localhost:5432/jev_mbti_ci?sslmode=require
    steps:
      - uses: actions/checkout@v6
      - uses: ./tooling/github/setup
      - name: Apply chart migrations and verify reruns
        run: |
          pnpm --filter @eslee/jev-mbti db:migrate
          pnpm --filter @eslee/jev-mbti db:migrate
      - name: Test chart rules, layouts, lore, and the chart service
        run: pnpm --filter @eslee/jev-mbti test

  railway-infrastructure:
    needs: [lint, format, typecheck, sushiro-tests]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    uses: ./.github/workflows/railway-config.yml
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  sushiro-production:
    needs: [lint, format, typecheck, sushiro-tests, railway-infrastructure]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sushiro-deploy.yml
    with:
      target: production
      branch: main
      head-sha: ${{ github.sha }}
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.SUSHIRO_VERCEL_TOKEN }}

  sushiro-preview:
    needs: [lint, format, typecheck, sushiro-tests]
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/sushiro-deploy.yml
    with:
      target: preview
      branch: ${{ github.head_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      pr-number: ${{ github.event.pull_request.number }}
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.SUSHIRO_VERCEL_TOKEN }}
