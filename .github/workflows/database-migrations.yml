name: Database Migrations

on:
  push:
    branches: [main]
    paths: ["packages/db/drizzle/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./tooling/github/setup
      - name: Check the database URL
        # A value that is not a bare URL (quoted, or with a leading space) parses relative to postgres://base and fails as getaddrinfo EAI_AGAIN base.
        run: |
          case "$DATABASE_URL" in
            postgres://* | postgresql://*) ;;
            *) echo "::error::The DATABASE_URL secret must be a bare postgres:// URL, without quotes or a variable name"; exit 1 ;;
          esac
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: pnpm --dir packages/db exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
